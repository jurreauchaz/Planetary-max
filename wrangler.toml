#:schema node_modules/wrangler/config-schema.json
name = "planetary-max"
main = "src/worker.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/v1/*"]

[vars]
ENVIRONMENT = "production"
PROTOCOL_VERSION = "DAT-JURREAUISM-v1"
PRE_TIER_INDEX = "IDX-PRETIER-001"
ISOLATE_MEMORY_LIMIT_MB = "128"
RPC_URL = "https://mainnet.base.org"
USDC_CONTRACT = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"

[[d1_databases]]
binding = "DB"
database_name = "planetary-max-db"
database_id = "cb3feb4d-3cf4-4126-b495-ff4095fe3f97"

[[kv_namespaces]]
binding = "KV_BINDING"
id = "9c1c8f836dca4d829de41e393e38fa0a"


[[ratelimits]]
name = "ADMIN_LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistryDO"

[[durable_objects.bindings]]
name = "BEEMAX_SECURE_REGISTRY"
class_name = "BEEMAXSecureNodeRegistryDO"

[[durable_objects.bindings]]
name = "ADMIN_SESSIONS"
class_name = "AdminSessionDO"

[[migrations]]
tag = "v1-node-registry"
new_sqlite_classes = ["NodeRegistryDO"]

[[migrations]]
tag = "v2-secure-registry"
new_sqlite_classes = ["BEEMAXSecureNodeRegistryDO"]

[[migrations]]
tag = "v3-admin-sessions"
new_sqlite_classes = ["AdminSessionDO"]

# BEEMAX uses your Cloudflare account; no model API key is sent to browsers.
[ai]
binding = "AI"

[[ratelimits]]
name = "BEEMAX_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
