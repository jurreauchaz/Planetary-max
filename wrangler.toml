#:schema node_modules/wrangler/config-schema.json
name = "planetary-max"
main = "src/worker.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"
PROTOCOL_VERSION = "DAT-JURREAUISM-v1"
PRE_TIER_INDEX = "IDX-PRETIER-001"
ISOLATE_MEMORY_LIMIT_MB = "128"

[[d1_databases]]
binding = "DB"
database_name = "planetary-max-db"
database_id = "YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "KV_BINDING"
id = "YOUR_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "YOUR_SESSION_KV_NAMESPACE_ID"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistryDO"

[[durable_objects.bindings]]
name = "BEEMAX_SECURE_REGISTRY"
class_name = "BEEMAXSecureNodeRegistryDO"

[[migrations]]
tag = "v1-node-registry"
new_sqlite_classes = ["NodeRegistryDO"]

[[migrations]]
tag = "v2-secure-registry"
new_sqlite_classes = ["BEEMAXSecureNodeRegistryDO"]
