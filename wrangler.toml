#:schema node_modules/wrangler/config-schema.json
name = "beemax-portal-os1"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
ENVIRONMENT = "development"
PROTOCOL_VERSION = "DAT-JURREAUISM-v1"
PRE_TIER_INDEX = "IDX-PRETIER-001"
ISOLATE_MEMORY_LIMIT_MB = "128"

# Durable Object bindings for the root Worker.
[[durable_objects.bindings]]
name = "BEEMAX_MESH_STATE"
class_name = "CognitiveNodeActor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CognitiveNodeActor"]

# Root Worker D1. Replace with the root database's ID; do not reuse Portal-OS D1.
[[d1_databases]]
binding = "DB"
database_name = "planetary_max_root_db"
database_id = "REPLACE_WITH_ROOT_D1_DATABASE_ID"
migrations_dir = "migrations"
